# 화면·API·채팅을 한 주소(80번)로 묶는다 → 브라우저 입장에서 같은 출처라 CORS 설정이 필요 없다
server {
    listen 80;
    server_name _;

    # 상품 사진 업로드 (application.yml max-request-size 50MB와 맞춤)
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    # REST API
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 채팅 WebSocket(STOMP): Upgrade 헤더를 넘겨야 연결이 HTTP에서 WebSocket으로 바뀐다
    location /ws-chat {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # 대화가 잠시 끊겨도 연결을 닫지 않게 (기본 60초)
        proxy_read_timeout 3600s;
    }

    # React Router: 새로고침해도 index.html로 (예: /chat/3)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
