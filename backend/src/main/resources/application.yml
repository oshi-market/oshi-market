spring:
  application:
    name: oshi-market
  # backend/.env (git 제외)의 CLOUDINARY_URL 등 로컬 비밀값을 읽는다. 파일이 없어도 기동은 됨.
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:oshimarket}
    username: ${DB_USERNAME:oshimarket}
    password: ${DB_PASSWORD:oshimarket}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  # 기본값을 두지 않는다. 공개 저장소의 기본 키로 운영 서버가 뜨면 누구나 토큰을 위조할 수 있어서, 값이 없으면 기동을 막는다.
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 3600000

# 사진 저장소. 값이 없으면 서버는 뜨지만 사진 업로드 시 IMAGE_STORAGE_NOT_CONFIGURED 에러.
cloudinary:
  url: ${CLOUDINARY_URL:}
  folder: oshi-market/items

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # 역할 구분이 없어 when-authorized면 로그인한 회원 누구나 DB 등 내부 구성을 보게 된다
      show-details: never
