# 로컬 개발용 DB. 배포용 docker-compose는 배포 단계에서 별도 작성 예정 (3_아키텍처및서비스흐름.md 참고).
# 사용법: docker compose up -d  →  Spring Boot 앱은 IDE에서 그대로 실행 (application.yml 기본값이 이 컨테이너를 가리킴)
services:
  postgres:
    image: postgres:16
    container_name: oshimarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: oshimarket
      POSTGRES_USER: oshimarket
      POSTGRES_PASSWORD: oshimarket
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
